name: Fetch GitHub Trending Monthly
# 触发规则：定时候选日 + 手动触发
on:
  schedule:
    # UTC时间：每月28,29,30,31日 23:00 触发
    - cron: '0 23 28-31 * *'
  workflow_dispatch: # 手动点击Run workflow随时执行

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run crawler script
        run: python main.py

      - name: Commit & Push new files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "[Bot] Update monthly trending $(date +%Y-%m)"
          git push
