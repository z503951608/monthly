name: Fetch GitHub Trending Monthly
# 每月1号 UTC时间 0点（北京时间上午8点）执行；同时支持手动点击Run workflow触发
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run crawler script
        run: python main.py

      - name: Commit & Push new files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 没有变更就跳过提交
          git diff --quiet && git diff --staged --quiet || git commit -m "[Bot] Update monthly trending $(date +%Y-%m)"
          git push
