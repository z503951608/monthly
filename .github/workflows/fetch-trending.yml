name: Fetch GitHub Trending Monthly
on:
  schedule:
    # UTC 每月28、29、30、31号 23:00 触发（覆盖所有月份的最后一天候选）
    - cron: '0 23 28-31 * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check if today is last day of month
        id: check_last_day
        run: |
          # 获取当月最后一天
          LAST_DAY=$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%d)
          TODAY=$(date +%d)
          echo "LAST_DAY=${LAST_DAY}" >> $GITHUB_OUTPUT
          echo "TODAY=${TODAY}" >> $GITHUB_OUTPUT
          if [ "$TODAY" != "$LAST_DAY" ];then
            echo "不是当月最后一天，直接退出"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run crawler script
        run: python main.py

      - name: Commit & Push new files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "[Bot] Update monthly trending $(date +%Y-%m)"
          git push
